[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-rag-backend"
version = "0.1.0"
description = "Enterprise knowledge base retrieval-augmented generation backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic==1.20.1",
  "dashscope==2.0.2",
  "email-validator==2.3.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pgvector==0.5.1",
  "prometheus-client==0.26.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.2",
  "pwdlib[argon2]==0.3.1",
  "pypdf==6.21.4",
  "pyjwt==2.15.1",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "sqlalchemy[asyncio]==2.1.6",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.1",
  "pip-tools==7.6.2",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]
concurrency = ["thread"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"app/cli/*.py" = ["RUF001"]
"app/modules/answers/service.py" = ["RUF001"]
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
files = ["app", "tests"]
