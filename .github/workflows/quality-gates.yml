name: Reusable Quality Gates

on:
  workflow_call:

permissions:
  contents: read

env:
  RAG_ENVIRONMENT: test
  RAG_DEBUG: "false"
  RAG_DOCS_ENABLED: "false"
  RAG_DATABASE_URL: postgresql+psycopg://rag_ci:ci-only-password@127.0.0.1:5432/rag1_test
  RAG_TEST_DATABASE_URL: postgresql+psycopg://rag_ci:ci-only-password@127.0.0.1:5432/rag1_test
  RAG_JWT_SECRET_KEY: ci-only-jwt-secret-with-at-least-thirty-two-characters
  RAG_METRICS_BEARER_TOKEN: ci-only-metrics-token-with-at-least-thirty-two-characters

jobs:
  backend:
    name: Backend tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: rag_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rag1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_ci -d rag1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install locked dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Enable pgvector in the disposable test database
        run: >-
          python -c "import psycopg; connection = psycopg.connect('postgresql://rag_ci:ci-only-password@127.0.0.1:5432/rag1_test'); connection.execute('CREATE EXTENSION IF NOT EXISTS vector'); connection.commit(); connection.close()"

      - name: Run tests and branch coverage
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Check database migration drift
        working-directory: backend
        run: python -m alembic check

      - name: Check code rules and formatting
        working-directory: backend
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run strict type checking
        working-directory: backend
        run: python -m mypy app tests

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend tests, browser flow, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting, code rules, and types
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint
          npm run type-check

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build production static files
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-evidence
          path: |
            frontend/coverage
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  rag-quality:
    name: Deterministic RAG quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: rag_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rag1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_ci -d rag1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked runtime dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Enable pgvector in the disposable evaluation database
        run: >-
          python -c "import psycopg; connection = psycopg.connect('postgresql://rag_ci:ci-only-password@127.0.0.1:5432/rag1_test'); connection.execute('CREATE EXTENSION IF NOT EXISTS vector'); connection.commit(); connection.close()"

      - name: Run isolated deterministic full-chain evaluation
        working-directory: backend
        run: >-
          python -m app.cli.run_reference_evaluation
          --mode full
          --generation-provider deterministic
          --output ../evaluation/reports/ci-reference-full.json

      - name: Upload the RAG quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rag-quality-report
          path: evaluation/reports/ci-reference-full.json
          if-no-files-found: error
          retention-days: 30

  container-build:
    name: Reproducible container builds
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image without publishing
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: enterprise-rag-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image without publishing
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: enterprise-rag-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
