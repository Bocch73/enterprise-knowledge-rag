name: 缺陷报告
description: 报告可以重复出现的错误
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 重现步骤
      description: 从干净状态开始，逐步写出如何看到问题。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 正确结果应该是什么？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 提供日志、截图、错误信息和环境版本，但先删除敏感信息。
